<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>TSRun</title>
<style>
:root {
    color-scheme: dark;
    --paper: #111;
    --ink: #EEE;
    --muted: #999;
    --line: #333;
    --accent: #0BF;
    --control-radius: 3.5px;
}
html, body {
    height: 100%;
    margin: 0;
    font: 13px/1.2 monospace;
    background: var(--paper);
    color: var(--ink);
}
body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
}
header {
    padding: 10px 14px 5px;
    border-bottom: 1px solid var(--line);
}
.colbox,
.rowbox {
    display: flex;
    gap: 6px;
}
.colbox {
    flex-direction: column;
    flex: 0;
    align-items: stretch;
}
.rowbox {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    min-width: 0;
}
a {
    color: var(--accent);
}
button, input {
    font: inherit;
}
button,
.switch {
    display: inline-block;
    padding: 5px 12px;
    border: 1px solid #666;
    border-radius: var(--control-radius);
    font-weight: bold;
    background: #333;
    color: var(--ink);
    cursor: pointer;
}
button:hover,
.switch:hover {
    background: #444;
}
button:active,
.switch:active {
    background: #000;
}
.switch {
    position: relative;
}
.switch:has(> input[type="checkbox"]:checked) {
    color: #000;
    background: var(--accent);
}
.switch > input[type="checkbox"] {
    position: absolute;
    width: 0;
    height: 0;
    margin: 0;
    opacity: 0;
    pointer-events: none;
}
.media-row {
    flex-wrap: nowrap;
}
.media-info {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: break-word;
    color: var(--muted);
}
.media-info.error,
.media-info > .error {
    font-weight: 600;
    color: var(--accent);
}
.rom-load {
    display: flex;
    flex: 1 1 auto;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    min-width: 0;
}
#rom0-info,
#rom1-info {
    text-align: right;
}
#workspace {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    background: var(--paper);
}
#screen-slot {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    min-height: 0;
}
#screen-slot:fullscreen {
    width: 100%;
    height: 100%;
    background: var(--paper);
}
#screen {
    display: block;
    image-rendering: pixelated;
}
#screen.crt {
    image-rendering: auto;
}
#keyboard-split {
    flex: 0 0 6px;
    cursor: row-resize;
    background: var(--line);
    touch-action: none;
}
#keyboard-split:hover,
body.keyboard-splitting #keyboard-split {
    background: var(--accent);
}
body.keyboard-splitting {
    user-select: none;
}
#keyboard {
    flex-shrink: 0;
    padding: 10px 14px 14px;
    border-top: none;
    touch-action: none;
}
.keyboard-face {
    position: relative;
    width: 533px;
    aspect-ratio: 533 / 191;
    margin: 0 auto;
    background: url("keyboard.png") center / 100% 100% no-repeat;
    isolation: isolate;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}
.keyboard-hit {
    position: absolute;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}
.keyboard-hit.hover {
    background: color-mix(in srgb, var(--accent) 25%, transparent);
}
.keyboard-hit.on,
.keyboard-hit.on.hover {
    background: #FFF;
    mix-blend-mode: difference;
}
@media (max-width: 700px) {
    .media-row {
        flex-wrap: wrap;
    }
}
</style>
</head>
<body>
<header id="page-header" class="colbox">
    <div class="rowbox">
        <button id="reset">Reset</button>
        <button id="nmi" title="Non-maskable interrupt">NMI</button>
        <label class="switch" title="Onscreen keyboard (F1)"><input id="keyboard-toggle" type="checkbox">Keyboard</label>
        <label class="switch" title="CRT display filter"><input id="crt" type="checkbox" checked>CRT</label>
        <label class="switch" title="Spread AY channels A/B/C across the stereo image; the hardware is mono"><input id="stereo" type="checkbox">Stereo</label>
        <button id="fullscreen-toggle" title="Fullscreen (F11)">Fullscreen</button>
        <div class="media-info"><span id="init-info">Initializing...</span> <span id="sound-info"></span> <span id="startup-file-info"></span></div>
        <a href="archive.html">Archive browser</a>
        <a href="https://github.com/josef-jelinek/TSRun">GitHub repo</a>
    </div>
    <div class="rowbox media-row">
        <button id="load-tape">Load Tape</button>
        <input id="file-tape" type="file" accept=".tap,.tzx" style="display: none">
        <label class="switch" title="Start selected tapes with the bundled TS2068 ROM loader"><input id="auto" type="checkbox" checked>Auto</label>
        <label class="switch"><input id="turbo" type="checkbox" checked>Turbo</label>
        <button id="play-tape" title="Start or resume tape playback" disabled>Play</button>
        <div id="tape-info" class="media-info">No tape</div>
        <div class="rom-load">
            <div id="rom0-info" class="media-info">No HOME ROM file</div>
            <button id="load-rom0" title="Set HOME ROM">Load ROM0</button>
            <input id="file-rom0" type="file" accept=".rom, .bin" style="display: none">
        </div>
    </div>
    <div class="rowbox media-row">
        <button id="load-cart">Load Cart</button>
        <input id="file-cart" type="file" accept=".dck" style="display: none">
        <button id="eject-cart">Eject</button>
        <div id="cart-info" class="media-info">No cartridge</div>
        <div class="rom-load">
            <div id="rom1-info" class="media-info">No EXROM file</div>
            <button id="load-rom1" title="Set EXROM">Load ROM1</button>
            <input id="file-rom1" type="file" accept=".rom, .bin" style="display: none">
        </div>
    </div>
</header>
<main id="workspace">
    <div id="screen-slot">
        <canvas id="screen" width="640" height="240"></canvas>
    </div>
    <div id="keyboard-split" style="display: none"></div>
    <div id="keyboard" style="display: none">
        <div class="keyboard-face"></div>
    </div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
